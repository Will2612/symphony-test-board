[project]
name = "symphony-test-board"
version = "0.1.0"
description = "Tiny Python library for Symphony orchestration demos."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["greet"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
