name: Project Sync

# Auto-adds new issues to the Symphony test board and updates
# their Status field as the issue moves through its lifecycle.
#
# - issues.opened   -> add to project 3 (idempotent), Status=Todo
# - issues.closed   -> Status=Done
#
# Uses GraphQL mutations directly to avoid `gh project item-edit`
# version-dependent behavior on the Actions runner.

on:
  issues:
    types: [opened, closed]

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Sync issue to project board
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ACTION: ${{ github.event.action }}
          PROJECT_ID: "PVT_kwHOCLz8xc4BZrIR"
          STATUS_FIELD_ID: "PVTSSF_lAHOCLz8xc4BZrIRzhUoKx0"
          OPTION_TODO: "f75ad846"
          OPTION_DONE: "98236657"
        run: |
          set -euo pipefail

          # Resolve the project item for this issue, if it already
          # exists. We use the issue's `projectItems` connection and
          # filter to our project by id.
          ITEM_ID="$(
            gh api graphql \
              -f query='
                query($contentId: ID!) {
                  node(id: $contentId) {
                    ... on Issue {
                      projectItems(first: 20) {
                        nodes { id project { id } }
                      }
                    }
                  }
                }
              ' \
              -f contentId="$ISSUE_NODE_ID" \
              --jq '.data.node.projectItems.nodes[]
                    | select(.project.id == "'"$PROJECT_ID"'")
                    | .id' \
              2>/dev/null || true
          )"

          # On opened: add to project if not present. On closed:
          # bail if not present (nothing to update).
          if [ "$ACTION" = "opened" ]; then
            if [ -z "$ITEM_ID" ]; then
              echo "::notice::Adding $ISSUE_URL to project"
              ITEM_ID="$(
                gh api graphql \
                  -f query='
                    mutation($projectId: ID!, $contentId: ID!) {
                      addProjectV2ItemById(
                        input: { projectId: $projectId, contentId: $contentId }
                      ) {
                        item { id }
                      }
                    }
                  ' \
                  -f projectId="$PROJECT_ID" \
                  -f contentId="$ISSUE_NODE_ID" \
                  --jq '.data.addProjectV2ItemById.item.id // ""'
              )"
            fi
            if [ -z "$ITEM_ID" ]; then
              echo "::error::Failed to obtain project item id"
              exit 1
            fi
            OPTION_ID="$OPTION_TODO"
          elif [ "$ACTION" = "closed" ]; then
            if [ -z "$ITEM_ID" ]; then
              echo "Issue $ISSUE_URL is not in project; nothing to update."
              exit 0
            fi
            OPTION_ID="$OPTION_DONE"
          else
            echo "Unhandled action: $ACTION"
            exit 0
          fi

          # Set the Status field.
          echo "::notice::Setting Status to $OPTION_ID on item $ITEM_ID"
          gh api graphql \
            -f query='
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(
                  input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: { singleSelectOptionId: $optionId }
                  }
                ) {
                  projectV2Item { id }
                }
              }
            ' \
            -f projectId="$PROJECT_ID" \
            -f itemId="$ITEM_ID" \
            -f fieldId="$STATUS_FIELD_ID" \
            -f optionId="$OPTION_ID"
