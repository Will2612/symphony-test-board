name: Project Sync

# Keeps the Symphony test board's Status field in sync with
# issue lifecycle on the linked repo.
#
# Auto-add behaviour: the project is configured to auto-add new
# issues from Will2612/symphony-test-board, so a fresh issue
# appears in the project at the default Status (Todo) without
# this workflow needing to call addProjectV2ItemById. The
# workflow only updates the Status field.
#
# - issues.opened   -> ensure Status=Todo (idempotent; usually no-op)
# - issues.closed   -> Status=Done
#
# Uses GraphQL mutations directly to avoid `gh project item-edit`
# version-dependent behaviour on the Actions runner.

on:
  issues:
    types: [opened, closed]

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Sync issue Status on the project board
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
          ACTION: ${{ github.event.action }}
          PROJECT_ID: "PVT_kwHOCLz8xc4BZrIR"
          STATUS_FIELD_ID: "PVTSSF_lAHOCLz8xc4BZrIRzhUoKx0"
          OPTION_TODO: "f75ad846"
          OPTION_DONE: "98236657"
        run: |
          set -euo pipefail

          # Resolve the project item id for this issue via the
          # issue's projectItems connection. Returns empty if
          # the issue is not in the project (e.g. auto-add has
          # not yet propagated, or the issue belongs to a
          # different project).
          ITEM_ID="$(
            gh api graphql \
              -f query='
                query($contentId: ID!) {
                  node(id: $contentId) {
                    ... on Issue {
                      projectItems(first: 20) {
                        nodes { id project { id } }
                      }
                    }
                  }
                }
              ' \
              -f contentId="$ISSUE_NODE_ID" \
              --jq '.data.node.projectItems.nodes[]
                    | select(.project.id == "'"$PROJECT_ID"'")
                    | .id' \
              2>/dev/null || true
          )"

          # Decide the target Status option from the event.
          case "$ACTION" in
            opened)  OPTION_ID="$OPTION_TODO"  ;;
            closed)  OPTION_ID="$OPTION_DONE"  ;;
            *)
              echo "Unhandled action: $ACTION"
              exit 0
              ;;
          esac

          # If the issue is not in the project, we cannot set
          # its Status. Log and exit cleanly. The issue should
          # have been auto-added by the project; if it wasn't,
          # the user can drag it in via the project UI.
          if [ -z "$ITEM_ID" ]; then
            echo "::notice::$ACTION event for issue not in project yet; skipping Status update (auto-add should have placed it)."
            exit 0
          fi

          # Set the Status field.
          echo "::notice::Setting Status to $OPTION_ID on item $ITEM_ID"
          gh api graphql \
            -f query='
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(
                  input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: { singleSelectOptionId: $optionId }
                  }
                ) {
                  projectV2Item { id }
                }
              }
            ' \
            -f projectId="$PROJECT_ID" \
            -f itemId="$ITEM_ID" \
            -f fieldId="$STATUS_FIELD_ID" \
            -f optionId="$OPTION_ID"
