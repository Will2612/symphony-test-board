name: Probe
on:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      issues: read
    steps:
      - name: Probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NODE_ID="I_kwDOSwf2mc8AAAABEWFf9Q"
          PROJECT_ID="PVT_kwHOCLz8xc4BZrIR"
          echo "=== raw query ==="
          gh api graphql \
            -f query='query($contentId: ID!) { node(id: $contentId) { ... on Issue { projectItems(first: 20) { totalCount nodes { id project { id } } } } } }' \
            -f contentId="$ISSUE_NODE_ID"
          echo "=== jq filter ==="
          gh api graphql \
            -f query='query($contentId: ID!) { node(id: $contentId) { ... on Issue { projectItems(first: 20) { totalCount nodes { id project { id } } } } } }' \
            -f contentId="$ISSUE_NODE_ID" \
            --jq '.data.node.projectItems.nodes[] | select(.project.id == "PVT_kwHOCLz8xc4BZrIR") | .id'
          echo "=== done ==="
